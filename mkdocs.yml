site_name: Signal Horse 用户手册
site_description: Signal Horse 本地优先交易工作台使用手册
site_url: https://signalhorse.github.io/docs/
docs_dir: docs
site_dir: site
strict: true

theme:
  name: material
  language: zh
  palette:
    - scheme: default
      primary: blue grey
      accent: blue grey
  features:
    - navigation.tabs
    - navigation.sections
    - navigation.top
    - toc.follow
    - search.highlight
    - search.share
    - content.code.copy

plugins:
  - search
  - i18n:
      docs_structure: suffix
      fallback_to_default: true
      reconfigure_material: true
      reconfigure_search: true
      languages:
        - locale: zh
          name: 简体中文
          build: true
          link: /zh/
          theme:
            language: zh
        - locale: en
          name: English
          default: true
          build: true
          link: /
          site_name: Signal Horse User Manual
          site_description: User guide for the Signal Horse local-first trading workstation
          theme:
            language: en
          nav:
            - Home: index.md
            - Getting Started:
                - Installation: getting-started/installation.md
                - First Run: getting-started/first-run.md
                - UI Overview: guides/ui-tour.md
                - Add Accounts: guides/add-account.md
            - Interface Guide:
                - Top Status Bar: guides/top-bar.md
                - Markets and Symbols Sidebar: guides/market-sidebar.md
                - Chart and Timeframe Tools: guides/chart-workspace.md
                - Bottom-Right AI Analysis: guides/ai-chart-analysis.md
                - AI Quick Order Modal: guides/ai-quick-order.md
                - One-Click Auto Trade: guides/auto-trade-launcher.md
                - Positions Tab: guides/positions-tab.md
                - Open Orders Tab: guides/open-orders-tab.md
                - Order History Tab: guides/order-history-tab.md
                - Position History Tab: guides/position-history-tab.md
                - Auto Trade Tab: guides/auto-trade-tab.md
                - Assets Tab: guides/assets-tab.md
                - Right Order Panel: guides/order-panel.md
                - Account Center: guides/account-center.md
                - AI Model Center: guides/ai-model-center.md
            - Workflows:
                - Manual Trading: guides/manual-trading.md
                - AI and Automation: guides/ai-automation.md
                - Updates and Maintenance: guides/update-maintenance.md
            - Reference:
                - FAQ: reference/faq.md
                - API Appendix (Advanced): reference/api.md

markdown_extensions:
  - admonition
  - attr_list
  - def_list
  - footnotes
  - md_in_html
  - tables
  - toc:
      permalink: true
  - pymdownx.details
  - pymdownx.highlight:
      anchor_linenums: true
  - pymdownx.inlinehilite
  - pymdownx.snippets
  - pymdownx.superfences
  - pymdownx.tabbed:
      alternate_style: true

nav:
  - 首页: index.md
  - 开始使用:
      - 安装部署: getting-started/installation.md
      - 首次启动: getting-started/first-run.md
      - 界面总览: guides/ui-tour.md
      - 添加账户: guides/add-account.md
  - 界面详解:
      - 顶部状态栏: guides/top-bar.md
      - 市场与交易对侧栏: guides/market-sidebar.md
      - 图表与周期工具: guides/chart-workspace.md
      - 右下角 AI 分析: guides/ai-chart-analysis.md
      - AI 快捷下单窗口: guides/ai-quick-order.md
      - 一键自动做单: guides/auto-trade-launcher.md
      - 持仓页: guides/positions-tab.md
      - 挂单页: guides/open-orders-tab.md
      - 历史委托页: guides/order-history-tab.md
      - 历史持仓页: guides/position-history-tab.md
      - 自动做单页: guides/auto-trade-tab.md
      - 资产页: guides/assets-tab.md
      - 右侧下单面板: guides/order-panel.md
      - 账户管理窗口: guides/account-center.md
      - AI 模型窗口: guides/ai-model-center.md
  - 操作流程:
      - 手动交易: guides/manual-trading.md
      - AI 与自动化: guides/ai-automation.md
      - 更新与维护: guides/update-maintenance.md
  - 参考:
      - 常见问题: reference/faq.md
      - API 附录（高级）: reference/api.md
